<!DOCTYPE html>
<html lang="az">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>C&H Parfum — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    :root{
      --bg:#f7f2ec;
      --paper:#fffdf9;
      --text:#211b17;
      --muted:#887a70;
      --brown:#70452f;
      --gold:#b8916e;
      --line:#e8ddd2;
      --danger:#a94442;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    header{
      background:var(--paper);
      border-bottom:1px solid var(--line);
      padding:22px 6%;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .logo{
      font-family:"Times New Roman",Times,serif;
      font-size:22px;
      font-weight:bold;
      letter-spacing:3px;
      color:var(--brown);
      position:relative;
      left:.78cm;
    }

    .logo span{
      display:block;
      font-size:10px;
      letter-spacing:4px;
      color:var(--gold);
      margin-top:4px;
    }

    .container{
      max-width:1100px;
      margin:40px auto;
      padding:0 20px;
    }

    .card{
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:16px;
      padding:25px;
      margin-bottom:25px;
      box-shadow:0 8px 30px rgba(80,50,30,.05);
    }

    h1,
    h2{
      margin-top:0;
      color:var(--brown);
    }

    .login{
      max-width:430px;
      margin:80px auto;
    }

    label{
      display:block;
      margin:15px 0 7px;
      font-size:14px;
      font-weight:bold;
    }

    input,
    textarea{
      width:100%;
      padding:13px;
      border:1px solid var(--line);
      border-radius:9px;
      background:white;
      font-size:15px;
      outline:none;
    }

    input:focus,
    textarea:focus{
      border-color:var(--gold);
    }

    textarea{
      min-height:100px;
      resize:vertical;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    button{
      border:0;
      border-radius:9px;
      padding:13px 20px;
      cursor:pointer;
      font-size:14px;
      font-weight:bold;
      background:var(--brown);
      color:white;
      margin-top:18px;
    }

    button:hover{
      opacity:.9;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .secondary{
      background:#e8ddd2;
      color:var(--brown);
    }

    .danger{
      background:var(--danger);
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:25px;
    }

    .product{
      border:1px solid var(--line);
      border-radius:12px;
      padding:15px;
      display:grid;
      grid-template-columns:100px 1fr auto;
      gap:18px;
      align-items:center;
      margin-bottom:15px;
      background:#fff;
    }

    .product img{
      width:100px;
      height:100px;
      object-fit:cover;
      border-radius:10px;
      background:#f3eee8;
    }

    .product h3{
      margin:0 0 8px;
      color:var(--brown);
    }

    .product p{
      margin:5px 0;
      color:var(--muted);
      font-size:14px;
    }

    .actions{
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .actions button{
      margin:0;
      min-width:90px;
    }

    .message{
      margin-top:15px;
      padding:12px;
      border-radius:8px;
      display:none;
    }

    .error{
      background:#f8dddd;
      color:#8b2e2e;
    }

    .success{
      background:#dff2df;
      color:#286428;
    }

    .hidden{
      display:none !important;
    }

    .preview{
      margin-top:10px;
      width:120px;
      height:120px;
      object-fit:cover;
      border-radius:10px;
      display:none;
      background:#f3eee8;
    }

    /* =========================
       ŞƏKİL LİNKİ
    ========================= */

    .image-link-box{
      display:flex;
      align-items:center;
      gap:8px;
      width:100%;
      max-width:700px;
      margin-top:10px;
    }

    .image-link{
      flex:1;
      min-width:0;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
      color:#5d5048;
      font-size:13px;
      line-height:1.4;
      word-break:break-all;
      user-select:text;
    }

    /* =========================
       X DÜYMƏSİ
    ========================= */
.remove-image{
  width:36px !important;
  height:36px !important;
  min-width:36px !important;
  max-width:36px !important;

  padding:0 !important;
  margin:0 !important;

  display:flex !important;
  align-items:center !important;
  justify-content:center !important;

  background:#5a321f !important;
  color:#ffffff !important;

  border:2px solid #3d2115 !important;
  border-radius:50% !important;

  font-family:Arial,sans-serif !important;
  font-size:20px !important;
  font-weight:bold !important;
  line-height:1 !important;

  cursor:pointer !important;

  box-shadow:0 3px 8px rgba(0,0,0,.25) !important;
}

.remove-image:hover{
  background:#3d2115 !important;
  color:#ffffff !important;
}

    /* =========================
       SIRA
    ========================= */

    .sort-number{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:42px;
      padding:7px 10px;
      border-radius:8px;
      background:#f3eee8;
      color:var(--brown);
      font-weight:bold;
      font-size:13px;
      margin-top:5px;
    }

    @media(max-width:700px){

      .row{
        grid-template-columns:1fr;
      }

      .product{
        grid-template-columns:80px 1fr;
      }

      .product img{
        width:80px;
        height:80px;
      }

      .actions{
        grid-column:1 / -1;
        flex-direction:row;
      }

      .topbar{
        align-items:flex-start;
        flex-direction:column;
      }

      .image-link-box{
        max-width:100%;
      }
    }
  </style>
</head>

<script>

  let editingProduct = null;
  let isSaving = false;

  // =====================================
  // LOGIN
  // =====================================

  async function login(){

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const errorBox =
      document.getElementById("loginError");

    errorBox.style.display = "none";


    if(!email || !password){

      showLoginError(
        "Email və şifrəni daxil edin."
      );

      return;
    }


    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email:email,
        password:password
      });


    if(error){

      showLoginError(
        error.message
      );

      return;
    }


    showAdmin();
  }


  function showLoginError(message){

    const box =
      document.getElementById("loginError");

    box.textContent = message;

    box.style.display = "block";
  }
// =====================================
// IMAGE PREVIEW
// =====================================

function previewImage(event,index){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }


  const previewId =
    getPreviewId(index);

  const linkBoxId =
    getLinkBoxId(index);

  const urlId =
    getUrlId(index);


  const preview =
    document.getElementById(previewId);

  const linkBox =
    document.getElementById(linkBoxId);

  const urlBox =
    document.getElementById(urlId);


  /* Şəklin önizləməsi */

  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";


  /*
    Yeni şəkil seçiləndə
    URL qutusunu da göstər
  */

  if(linkBox){

    linkBox.classList.remove("hidden");

  }


  /*
    Yeni şəkil seçildi yazısı
  */

  if(urlBox){

    urlBox.textContent =
      "Yeni şəkil seçildi";


    // =====================================
    // X DÜYMƏSİ
    // =====================================

    let removeButton =
      linkBox.querySelector(".remove-image-link");


    // Əgər X hələ yoxdursa yarat

    if(!removeButton){

      removeButton =
        document.createElement("button");

      removeButton.type =
        "button";

      removeButton.className =
        "remove-image-link";

      removeButton.textContent =
        "×";


      /*
        X düyməsinə basanda
        yalnız link/yazı silinir
      */

      removeButton.onclick =
        function(){

          urlBox.textContent = "";

          removeButton.remove();

        };


      linkBox.appendChild(
        removeButton
      );

    }

  }

}

  // =====================================
  // IMAGE DELETE
  // =====================================

  async function removeImage(index){

    const column =
      getColumn(index);

    const previewId =
      getPreviewId(index);

    const linkBoxId =
      getLinkBoxId(index);

    const urlId =
      getUrlId(index);

    const fileInputId =
      getFileInputId(index);


    const fileInput =
      document.getElementById(fileInputId);


    /* Yeni seçilmiş şəkli ləğv et */

    if(fileInput && fileInput.files.length > 0){

      fileInput.value = "";

      const preview =
        document.getElementById(previewId);

      preview.src = "";
      preview.style.display = "none";


      if(editingProduct && editingProduct[column]){

        document
          .getElementById(urlId)
          .textContent =
          editingProduct[column];

        document
          .getElementById(linkBoxId)
          .classList
          .remove("hidden");

        preview.src =
          editingProduct[column];

        preview.style.display =
          "block";
      }

      return;
    }


    /* Yeni məhsuldursa */

    if(!editingProduct){

      fileInput.value = "";

      document
        .getElementById(previewId)
        .src = "";

      document
        .getElementById(previewId)
        .style
        .display = "none";

      document
        .getElementById(urlId)
        .textContent = "";

      document
        .getElementById(linkBoxId)
        .classList
        .add("hidden");

      return;
    }


    const imageUrl =
      editingProduct[column];


    if(!imageUrl){

      fileInput.value = "";

      document
        .getElementById(previewId)
        .src = "";

      document
        .getElementById(previewId)
        .style
        .display = "none";

      document
        .getElementById(urlId)
        .textContent = "";

      document
        .getElementById(linkBoxId)
        .classList
        .add("hidden");

      return;
    }


    const answer =
      confirm(
        "Bu şəkli silmək istədiyinizə əminsiniz?"
      );


    if(!answer){
      return;
    }


    try{

      /* DB-dən linki sil */

      const updateData = {};

      updateData[column] = null;


      const { error:dbError } =
        await supabaseClient
          .from("products")
          .update(updateData)
          .eq(
            "id",
            editingProduct.id
          );


      if(dbError){
        throw dbError;
      }


      /* Storage-dan şəkli sil */

      await deleteStorageImage(
        imageUrl
      );


      /* Ekranı təmizlə */

      editingProduct[column] = null;


      document
        .getElementById(previewId)
        .src = "";

      document
        .getElementById(previewId)
        .style
        .display = "none";


      document
        .getElementById(urlId)
        .textContent = "";


      document
        .getElementById(linkBoxId)
        .classList
        .add("hidden");


      fileInput.value = "";


      showFormMessage(
        "Şəkil uğurla silindi.",
        "success"
      );


      await loadProducts();


    }catch(error){

      showFormMessage(
        "Şəkil silinmədi: " +
        error.message,
        "error"
      );
    }
  }


  // =====================================
  // SESSION
  // =====================================

  async function checkSession(){

    const {
      data:{session}
    } =
      await supabaseClient.auth.getSession();


    if(session){

      showAdmin();

    }else{

      showLogin();
    }
  }


  // =====================================
  // SHOW ADMIN
  // =====================================

  function showAdmin(){

    document
      .getElementById("loginPage")
      .classList
      .add("hidden");


    document
      .getElementById("adminPage")
      .classList
      .remove("hidden");


    document
      .getElementById("logoutBtn")
      .classList
      .remove("hidden");


    loadProducts();
  }


  // =====================================
  // SHOW LOGIN
  // =====================================

  function showLogin(){

    document
      .getElementById("loginPage")
      .classList
      .remove("hidden");


    document
      .getElementById("adminPage")
      .classList
      .add("hidden");


    document
      .getElementById("logoutBtn")
      .classList
      .add("hidden");
  }


  // =====================================
  // LOGOUT
  // =====================================

  async function logout(){

    await supabaseClient.auth.signOut();

    showLogin();
  }


  // =====================================
  // LOAD PRODUCTS
  // =====================================

  async function loadProducts(){

    const list =
      document.getElementById("productsList");


    list.innerHTML =
      "Yüklənir...";


    const { data,error } =
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "sort_order",
          {
            ascending:true
          }
        )
        .order(
          "created_at",
          {
            ascending:true
          }
        );


    if(error){

      list.innerHTML = `
        <div
          class="message error"
          style="display:block"
        >
          Məhsullar yüklənmədi:
          ${escapeHtml(error.message)}
        </div>
      `;

      return;
    }


    if(!data || data.length === 0){

      list.innerHTML = `
        <p style="color:var(--muted)">
          Hələ heç bir məhsul əlavə edilməyib.
        </p>
      `;

      return;
    }


    list.innerHTML =
      data
        .map(product => {

          const image =
            product.image_url ||
            "https://via.placeholder.com/100?text=Parfum";


          return `

            <div class="product">

              <img
                src="${escapeAttr(image)}"
                alt="${escapeAttr(product.name)}"
              >

              <div>

                <h3>
                  ${escapeHtml(product.name)}
                </h3>

                <div class="sort-number">
                  Sıra:
                  ${escapeHtml(product.sort_order ?? "")}
                </div>

                <p>
                  ${Number(product.price).toFixed(2)} AZN
                  · ${product.ml} ML
                  · Stok: ${product.stock}
                </p>

                <p>
                  ${escapeHtml(
                    product.description || ""
                  )}
                </p>

              </div>

              <div class="actions">

                <button
                  onclick='editProduct(${JSON.stringify(product)})'
                >
                  Redaktə
                </button>

                <button
                  class="danger"
                  onclick="deleteProduct(${product.id})"
                >
                  Sil
                </button>

              </div>

            </div>

          `;

        })
        .join("");
  }


  // =====================================
  // CLEAR FORM
  // =====================================

  function clearForm(){

    document
      .getElementById("productId")
      .value = "";

    document
      .getElementById("name")
      .value = "";

    document
      .getElementById("price")
      .value = "";

    document
      .getElementById("ml")
      .value = "";

    document
      .getElementById("stock")
      .value = "";

    document
      .getElementById("sort_order")
      .value = "";

    document
      .getElementById("description")
      .value = "";


    document
      .getElementById("image")
      .value = "";

    document
      .getElementById("image2")
      .value = "";

    document
      .getElementById("image3")
      .value = "";


    [
      "imagePreview",
      "imagePreview2",
      "imagePreview3"
    ]
    .forEach(id => {

      const preview =
        document.getElementById(id);

      preview.src = "";

      preview.style.display =
        "none";
    });


    [
      ["imageLink1","imageUrl1"],
      ["imageLink2","imageUrl2"],
      ["imageLink3","imageUrl3"]
    ]
    .forEach(item => {

      document
        .getElementById(item[0])
        .classList
        .add("hidden");

      document
        .getElementById(item[1])
        .textContent = "";
    });
  }


  // =====================================
  // NEXT SORT ORDER
  // =====================================

  async function getNextSortOrder(){

    const { data,error } =
      await supabaseClient
        .from("products")
        .select("sort_order")
        .order(
          "sort_order",
          {
            ascending:false
          }
        )
        .limit(1);


    if(error){
      return 1;
    }


    if(!data || data.length === 0){
      return 1;
    }


    return Number(
      data[0].sort_order || 0
    ) + 1;
  }


  // =====================================
  // NEW PRODUCT
  // =====================================

  async function newProduct(){

    editingProduct = null;

    clearForm();


    document
      .getElementById("formTitle")
      .textContent =
      "Yeni məhsul əlavə et";


    document
      .getElementById("formMessage")
      .style
      .display = "none";


    const nextOrder =
      await getNextSortOrder();


    document
      .getElementById("sort_order")
      .value =
      nextOrder;


    const saveButton =
      document.getElementById(
        "saveButton"
      );

    saveButton.disabled = false;

    saveButton.textContent =
      "Yadda saxla";
  }


  // =====================================
  // EDIT PRODUCT
  // =====================================

  function editProduct(product){

    editingProduct = product;


    document
      .getElementById("productId")
      .value =
      product.id;


    document
      .getElementById("name")
      .value =
      product.name || "";


    document
      .getElementById("price")
      .value =
      product.price ?? "";


    document
      .getElementById("ml")
      .value =
      product.ml ?? "";


    document
      .getElementById("stock")
      .value =
      product.stock ?? "";


    document
      .getElementById("sort_order")
      .value =
      product.sort_order ?? "";


    document
      .getElementById("description")
      .value =
      product.description || "";


    document
      .getElementById("image")
      .value = "";

    document
      .getElementById("image2")
      .value = "";

    document
      .getElementById("image3")
      .value = "";


    document
      .getElementById("formTitle")
      .textContent =
      "Məhsulu redaktə et";


    setExistingImage(
      1,
      product.image_url
    );

    setExistingImage(
      2,
      product.image_url_2
    );

    setExistingImage(
      3,
      product.image_url_3
    );


    document
      .getElementById("formMessage")
      .style
      .display = "none";


    document
      .getElementById("saveButton")
      .disabled = false;


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  }


  // =====================================
  // EXISTING IMAGE
  // =====================================

  function setExistingImage(
    index,
    url
  ){

    const preview =
      document.getElementById(
        getPreviewId(index)
      );

    const linkBox =
      document.getElementById(
        getLinkBoxId(index)
      );

    const urlBox =
      document.getElementById(
        getUrlId(index)
      );


    if(url){

      preview.src = url;

      preview.style.display =
        "block";


      urlBox.textContent =
        url;


      linkBox.classList
        .remove("hidden");

    }else{

      preview.src = "";

      preview.style.display =
        "none";

      urlBox.textContent = "";

      linkBox.classList
        .add("hidden");
    }
  }


  // =====================================
  // UPLOAD IMAGE
  // =====================================

  async function uploadImage(file){

    if(!file){
      return null;
    }


    const ext =
      (
        file.name
          .split(".")
          .pop() ||
        "jpg"
      )
      .toLowerCase()
      .replace(
        /[^a-z0-9]/g,
        ""
      );


    const path =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2) +
      "." +
      ext;


    const { error } =
      await supabaseClient
        .storage
        .from("product-images")
        .upload(
          path,
          file,
          {
            upsert:false,
            contentType:file.type
          }
        );


    if(error){
      throw error;
    }


    const { data } =
      supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(path);


    return data.publicUrl;
  }


  // =====================================
  // DELETE STORAGE IMAGE
  // =====================================

  async function deleteStorageImage(
    imageUrl
  ){

    if(!imageUrl){
      return;
    }


    const marker =
      "/storage/v1/object/public/product-images/";


    const position =
      imageUrl.indexOf(marker);


    if(position === -1){
      return;
    }


    const filePath =
      decodeURIComponent(
        imageUrl.substring(
          position + marker.length
        )
      );


    const { error } =
      await supabaseClient
        .storage
        .from("product-images")
        .remove([
          filePath
        ]);


    if(error){

      console.warn(
        "Şəkil Storage-dan silinmədi:",
        error.message
      );
    }
  }


  // =====================================
  // SAVE PRODUCT
  // =====================================

  async function saveProduct(){

    if(isSaving){
      return;
    }


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const price =
      Number(
        document
          .getElementById("price")
          .value
      );


    const ml =
      Number(
        document
          .getElementById("ml")
          .value
      );


    const stock =
      Number(
        document
          .getElementById("stock")
          .value
      );


    const sort_order =
      Number(
        document
          .getElementById("sort_order")
          .value
      );


    const description =
      document
        .getElementById("description")
        .value
        .trim();


    const file1 =
      document
        .getElementById("image")
        .files[0];


    const file2 =
      document
        .getElementById("image2")
        .files[0];


    const file3 =
      document
        .getElementById("image3")
        .files[0];


    const message =
      document.getElementById(
        "formMessage"
      );


    const saveButton =
      document.getElementById(
        "saveButton"
      );


    message.style.display =
      "none";


    if(
      !name ||
      !price ||
      !ml
    ){

      showFormMessage(
        "Ad, qiymət və ML məlumatlarını doldurun.",
        "error"
      );

      return;
    }


    if(
      !sort_order ||
      sort_order < 1
    ){

      showFormMessage(
        "Sıra nömrəsini 1 və ya daha böyük yazın.",
        "error"
      );

      return;
    }


    isSaving = true;

    saveButton.disabled = true;

    saveButton.textContent =
      "Yadda saxlanılır...";


    try{

      const oldImageUrl =
        editingProduct?.image_url ||
        null;

      const oldImageUrl2 =
        editingProduct?.image_url_2 ||
        null;

      const oldImageUrl3 =
        editingProduct?.image_url_3 ||
        null;


      let imageUrl =
        oldImageUrl;

      let imageUrl2 =
        oldImageUrl2;

      let imageUrl3 =
        oldImageUrl3;


      if(file1){

        imageUrl =
          await uploadImage(file1);
      }


      if(file2){

        imageUrl2 =
          await uploadImage(file2);
      }


      if(file3){

        imageUrl3 =
          await uploadImage(file3);
      }


      const productData = {

        name:name,

        price:price,

        ml:ml,

        stock:stock || 0,

        sort_order:sort_order,

        image_url:imageUrl,

        image_url_2:imageUrl2,

        image_url_3:imageUrl3,

        description:description
      };


      // MÖVCUD MƏHSUL

      if(editingProduct){

        const { error } =
          await supabaseClient
            .from("products")
            .update(productData)
            .eq(
              "id",
              editingProduct.id
            );


        if(error){
          throw error;
        }


        if(file1 && oldImageUrl){

          await deleteStorageImage(
            oldImageUrl
          );
        }


        if(file2 && oldImageUrl2){

          await deleteStorageImage(
            oldImageUrl2
          );
        }


        if(file3 && oldImageUrl3){

          await deleteStorageImage(
            oldImageUrl3
          );
        }


        showFormMessage(
          "Məhsul uğurla yeniləndi.",
          "success"
        );


        editingProduct = null;

        clearForm();


        document
          .getElementById("formTitle")
          .textContent =
          "Yeni məhsul əlavə et";
      }


      // YENİ MƏHSUL

      else{

        const { error } =
          await supabaseClient
            .from("products")
            .insert(
              productData
            );


        if(error){
          throw error;
        }


        showFormMessage(
          "Məhsul uğurla əlavə edildi.",
          "success"
        );


        editingProduct = null;

        clearForm();


        document
          .getElementById("formTitle")
          .textContent =
          "Yeni məhsul əlavə et";
      }


      await loadProducts();


    }catch(error){

      showFormMessage(
        "Xəta: " +
        error.message,
        "error"
      );

    }finally{

      isSaving = false;

      saveButton.disabled =
        false;

      saveButton.textContent =
        "Yadda saxla";
    }
  }


  // =====================================
  // FORM MESSAGE
  // =====================================

  function showFormMessage(
    text,
    type
  ){

    const message =
      document.getElementById(
        "formMessage"
      );


    message.textContent =
      text;


    message.className =
      "message " +
      (
        type === "success"
          ? "success"
          : "error"
      );


    message.style.display =
      "block";
  }


  // =====================================
  // DELETE PRODUCT
  // =====================================

  async function deleteProduct(id){

    const answer =
      confirm(
        "Bu məhsulu silmək istədiyinizə əminsiniz?"
      );


    if(!answer){
      return;
    }


    const { data:product,error } =
      await supabaseClient
        .from("products")
        .select(
          "image_url,image_url_2,image_url_3"
        )
        .eq(
          "id",
          id
        )
        .single();


    if(error){

      alert(
        "Məhsul məlumatı alınmadı: " +
        error.message
      );

      return;
    }


    const { error:deleteError } =
      await supabaseClient
        .from("products")
        .delete()
        .eq(
          "id",
          id
        );


    if(deleteError){

      alert(
        "Məhsul silinmədi: " +
        deleteError.message
      );

      return;
    }


    await deleteStorageImage(
      product.image_url
    );

    await deleteStorageImage(
      product.image_url_2
    );

    await deleteStorageImage(
      product.image_url_3
    );


    await loadProducts();
  }


  // =====================================
  // SECURITY HELPERS
  // =====================================

  function escapeHtml(value){

    return String(
      value ?? ""
    )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
  }


  function escapeAttr(value){

    return escapeHtml(value);
  }


  // =====================================
  // START
  // =====================================

  checkSession();

</script>
