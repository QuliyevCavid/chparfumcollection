<!DOCTYPE html>
<html lang="az">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>C&H Parfum — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    :root{
      --bg:#f7f2ec;
      --paper:#fffdf9;
      --text:#211b17;
      --muted:#887a70;
      --brown:#70452f;
      --gold:#b8916e;
      --line:#e8ddd2;
      --danger:#a94442;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    header{
      background:var(--paper);
      border-bottom:1px solid var(--line);
      padding:22px 6%;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .logo{
      font-family:"Times New Roman",Times,serif;
      font-size:22px;
      font-weight:bold;
      letter-spacing:3px;
      color:var(--brown);
      position:relative;
      left:.78cm;
    }

    .logo span{
      display:block;
      font-size:10px;
      letter-spacing:4px;
      color:var(--gold);
      margin-top:4px;
    }

    .container{
      max-width:1100px;
      margin:40px auto;
      padding:0 20px;
    }

    .card{
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:16px;
      padding:25px;
      margin-bottom:25px;
      box-shadow:0 8px 30px rgba(80,50,30,.05);
    }

    h1,
    h2{
      margin-top:0;
      color:var(--brown);
    }

    .login{
      max-width:430px;
      margin:80px auto;
    }

    label{
      display:block;
      margin:15px 0 7px;
      font-size:14px;
      font-weight:bold;
    }

    input,
    textarea{
      width:100%;
      padding:13px;
      border:1px solid var(--line);
      border-radius:9px;
      background:white;
      font-size:15px;
      outline:none;
    }

    input:focus,
    textarea:focus{
      border-color:var(--gold);
    }

    textarea{
      min-height:100px;
      resize:vertical;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    button{
      border:0;
      border-radius:9px;
      padding:13px 20px;
      cursor:pointer;
      font-size:14px;
      font-weight:bold;
      background:var(--brown);
      color:white;
      margin-top:18px;
    }

    button:hover{
      opacity:.9;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .secondary{
      background:#e8ddd2;
      color:var(--brown);
    }

    .danger{
      background:var(--danger);
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:25px;
    }

    .product{
      border:1px solid var(--line);
      border-radius:12px;
      padding:15px;
      display:grid;
      grid-template-columns:100px 1fr auto;
      gap:18px;
      align-items:center;
      margin-bottom:15px;
      background:#fff;
    }

    .product img{
      width:100px;
      height:100px;
      object-fit:cover;
      border-radius:10px;
      background:#f3eee8;
    }

    .product h3{
      margin:0 0 8px;
      color:var(--brown);
    }

    .product p{
      margin:5px 0;
      color:var(--muted);
      font-size:14px;
    }

    .actions{
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .actions button{
      margin:0;
      min-width:90px;
    }

    .message{
      margin-top:15px;
      padding:12px;
      border-radius:8px;
      display:none;
    }

    .error{
      background:#f8dddd;
      color:#8b2e2e;
    }

    .success{
      background:#dff2df;
      color:#286428;
    }

    .hidden{
      display:none !important;
    }

    .preview{
      margin-top:10px;
      width:120px;
      height:120px;
      object-fit:cover;
      border-radius:10px;
      display:none;
      background:#f3eee8;
    }

    /* Şəkil linki */

    .image-link-box{
      display:flex;
      align-items:center;
      gap:8px;
      width:100%;
      max-width:600px;
      margin-top:10px;
    }

    .image-link{
      flex:1;
      min-width:0;
      padding:9px 11px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
      color:var(--muted);
      font-size:13px;
      word-break:break-all;
    }

    /* Şəkil silmə X düyməsi */

    .remove-image{
      width:30px;
      height:30px;
      padding:0;
      margin:0;
      flex-shrink:0;

      border-radius:50%;
      border:1px solid var(--gold);

      background:var(--paper);
      color:var(--brown);

      font-size:18px;
      font-family:Arial,sans-serif;
      font-weight:normal;

      display:flex;
      align-items:center;
      justify-content:center;

      cursor:pointer;

      box-shadow:0 3px 10px rgba(80,50,30,.12);
    }

    .remove-image:hover{
      background:var(--brown);
      color:white;
      border-color:var(--brown);
    }

    @media(max-width:700px){

      .row{
        grid-template-columns:1fr;
      }

      .product{
        grid-template-columns:80px 1fr;
      }

      .product img{
        width:80px;
        height:80px;
      }

      .actions{
        grid-column:1 / -1;
        flex-direction:row;
      }

      .topbar{
        align-items:flex-start;
        flex-direction:column;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    C&H PARFUM
    <span>COLLECTION</span>
  </div>

  <button
    id="logoutBtn"
    class="secondary hidden"
    onclick="logout()"
  >
    Çıxış
  </button>

</header>


<!-- ================================
     LOGIN
================================ -->

<div id="loginPage" class="container">

  <div class="card login">

    <h1>Admin panel</h1>

    <p style="color:var(--muted)">
      Məhsulları idarə etmək üçün daxil olun.
    </p>

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Email ünvanınız"
    >

    <label>Şifrə</label>

    <input
      type="password"
      id="password"
      placeholder="Şifrəniz"
    >

    <button onclick="login()">
      Daxil ol
    </button>

    <div
      id="loginError"
      class="message error"
    ></div>

  </div>

</div>


<!-- ================================
     ADMIN PANEL
================================ -->

<div
  id="adminPage"
  class="container hidden"
>

  <div class="topbar">

    <div>

      <h1>Admin panel</h1>

      <p style="color:var(--muted);margin:0">
        C&H Parfum Collection məhsullarını idarə et.
      </p>

    </div>

    <button
      class="secondary"
      onclick="newProduct()"
    >
      + Yeni məhsul
    </button>

  </div>


  <!-- ================================
       PRODUCT FORM
  ================================ -->

  <div class="card">

    <h2 id="formTitle">
      Yeni məhsul əlavə et
    </h2>

    <input
      type="hidden"
      id="productId"
    >

    <label>Parfum adı</label>

    <input
      type="text"
      id="name"
      placeholder="Məsələn: NIGHT OUD"
    >


    <div class="row">

      <div>

        <label>Qiymət (AZN)</label>

        <input
          type="number"
          id="price"
          step="0.01"
          placeholder="49"
        >

      </div>

      <div>

        <label>Həcm (ML)</label>

        <input
          type="number"
          id="ml"
          placeholder="50"
        >

      </div>

    </div>


    <label>Anbarda say</label>

    <input
      type="number"
      id="stock"
      placeholder="10"
    >


    <!-- ================================
         IMAGE 1
    ================================ -->

    <label>Şəkil 1</label>

    <input
      type="file"
      id="image"
      accept="image/*"
      onchange="previewImage(event,'imagePreview','imageLink1')"
    >

    <img
      id="imagePreview"
      class="preview"
    >

    <div
      id="imageLink1"
      class="image-link-box hidden"
    >

      <div
        id="imageUrl1"
        class="image-link"
      ></div>

      <button
        type="button"
        class="remove-image"
        onclick="removeImage(1)"
        title="Şəkli sil"
      >×</button>

    </div>


    <!-- ================================
         IMAGE 2
    ================================ -->

    <label>Şəkil 2</label>

    <input
      type="file"
      id="image2"
      accept="image/*"
      onchange="previewImage(event,'imagePreview2','imageLink2')"
    >

    <img
      id="imagePreview2"
      class="preview"
    >

    <div
      id="imageLink2"
      class="image-link-box hidden"
    >

      <div
        id="imageUrl2"
        class="image-link"
      ></div>

      <button
        type="button"
        class="remove-image"
        onclick="removeImage(2)"
        title="Şəkli sil"
      >×</button>

    </div>


    <!-- ================================
         IMAGE 3
    ================================ -->

    <label>Şəkil 3</label>

    <input
      type="file"
      id="image3"
      accept="image/*"
      onchange="previewImage(event,'imagePreview3','imageLink3')"
    >

    <img
      id="imagePreview3"
      class="preview"
    >

    <div
      id="imageLink3"
      class="image-link-box hidden"
    >

      <div
        id="imageUrl3"
        class="image-link"
      ></div>

      <button
        type="button"
        class="remove-image"
        onclick="removeImage(3)"
        title="Şəkli sil"
      >×</button>

    </div>


    <label>Açıqlama</label>

    <textarea
      id="description"
      placeholder="Parfum haqqında qısa məlumat..."
    ></textarea>


    <button
      id="saveButton"
      onclick="saveProduct()"
    >
      Yadda saxla
    </button>

    <button
      class="secondary"
      onclick="newProduct()"
      type="button"
    >
      Təmizlə
    </button>


    <div
      id="formMessage"
      class="message"
    ></div>

  </div>


  <!-- ================================
       PRODUCTS
  ================================ -->

  <div class="card">

    <h2>Məhsullar</h2>

    <div id="productsList">
      Yüklənir...
    </div>

  </div>

</div>


<script>

  let editingProduct = null;
  let isSaving = false;


  // =====================================
  // LOGIN
  // =====================================

  async function login(){

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    const errorBox =
      document.getElementById("loginError");

    errorBox.style.display = "none";


    if(!email || !password){

      showLoginError(
        "Email və şifrəni daxil edin."
      );

      return;
    }


    const { error } =
      await supabaseClient.auth.signInWithPassword({

        email:email,
        password:password

      });


    if(error){

      showLoginError(
        error.message
      );

      return;
    }


    showAdmin();
  }


  function showLoginError(message){

    const box =
      document.getElementById("loginError");

    box.textContent = message;

    box.style.display = "block";
  }


  // =====================================
  // IMAGE PREVIEW
  // =====================================

  function previewImage(
    event,
    previewId,
    linkBoxId
  ){

    const file =
      event.target.files[0];

    if(!file){
      return;
    }


    const preview =
      document.getElementById(previewId);

    if(!preview){
      return;
    }


    preview.src =
      URL.createObjectURL(file);

    preview.style.display =
      "block";


    // Yeni şəkil seçildikdə
    // köhnə linki gizlət

    const linkBox =
      document.getElementById(linkBoxId);

    if(linkBox){

      linkBox.classList.add(
        "hidden"
      );
    }
  }


  // =====================================
  // IMAGE DELETE
  // =====================================

  async function removeImage(index){

    const column =
      index === 1
        ? "image_url"
        : index === 2
          ? "image_url_2"
          : "image_url_3";


    const previewId =
      index === 1
        ? "imagePreview"
        : index === 2
          ? "imagePreview2"
          : "imagePreview3";


    const linkBoxId =
      index === 1
        ? "imageLink1"
        : index === 2
          ? "imageLink2"
          : "imageLink3";


    const fileInputId =
      index === 1
        ? "image"
        : index === 2
          ? "image2"
          : "image3";


    // Yeni məhsuldursa
    // sadəcə seçilmiş şəkli təmizlə

    if(!editingProduct){

      document
        .getElementById(fileInputId)
        .value = "";

      document
        .getElementById(previewId)
        .src = "";

      document
        .getElementById(previewId)
        .style.display = "none";

      document
        .getElementById(linkBoxId)
        .classList.add("hidden");

      return;
    }


    const imageUrl =
      editingProduct[column];


    if(!imageUrl){
      return;
    }


    const answer =
      confirm(
        "Bu şəkli silmək istədiyinizə əminsiniz?"
      );


    if(!answer){
      return;
    }


    try{

      // ================================
      // DATABASE-DƏN LINKİ SİL
      // ================================

      const updateData = {};

      updateData[column] = null;


      const { error:dbError } =
        await supabaseClient
          .from("products")
          .update(updateData)
          .eq(
            "id",
            editingProduct.id
          );


      if(dbError){
        throw dbError;
      }


      // ================================
      // STORAGE-DAN ŞƏKİLİ SİL
      // ================================

      const marker =
        "/storage/v1/object/public/product-images/";

      const position =
        imageUrl.indexOf(marker);


      if(position !== -1){

        const filePath =
          decodeURIComponent(
            imageUrl.substring(
              position + marker.length
            )
          );


        const { error:storageError } =
          await supabaseClient
            .storage
            .from("product-images")
            .remove([
              filePath
            ]);


        if(storageError){

          console.warn(
            "Storage şəkli silinmədi:",
            storageError.message
          );
        }
      }


      // ================================
      // EKRANI TƏMİZLƏ
      // ================================

      editingProduct[column] =
        null;


      document
        .getElementById(previewId)
        .src = "";

      document
        .getElementById(previewId)
        .style.display = "none";


      document
        .getElementById(linkBoxId)
        .classList.add("hidden");


      document
        .getElementById(fileInputId)
        .value = "";


      showFormMessage(
        "Şəkil uğurla silindi.",
        "success"
      );


      await loadProducts();


    }catch(error){

      showFormMessage(
        "Şəkil silinmədi: " +
        error.message,
        "error"
      );

    }
  }


  // =====================================
  // CHECK SESSION
  // =====================================

  async function checkSession(){

    const {
      data:{session}
    } =
      await supabaseClient.auth.getSession();


    if(session){

      showAdmin();

    }else{

      showLogin();

    }
  }


  // =====================================
  // SHOW ADMIN
  // =====================================

  function showAdmin(){

    document
      .getElementById("loginPage")
      .classList
      .add("hidden");


    document
      .getElementById("adminPage")
      .classList
      .remove("hidden");


    document
      .getElementById("logoutBtn")
      .classList
      .remove("hidden");


    loadProducts();
  }


  // =====================================
  // SHOW LOGIN
  // =====================================

  function showLogin(){

    document
      .getElementById("loginPage")
      .classList
      .remove("hidden");


    document
      .getElementById("adminPage")
      .classList
      .add("hidden");


    document
      .getElementById("logoutBtn")
      .classList
      .add("hidden");
  }


  // =====================================
  // LOGOUT
  // =====================================

  async function logout(){

    await supabaseClient.auth.signOut();

    showLogin();
  }


  // =====================================
  // LOAD PRODUCTS
  // =====================================

  async function loadProducts(){

    const list =
      document.getElementById("productsList");


    list.innerHTML =
      "Yüklənir...";


    const { data,error } =
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "created_at",
          {
            ascending:true
          }
        );


    if(error){

      list.innerHTML = `
        <div
          class="message error"
          style="display:block"
        >
          Məhsullar yüklənmədi:
          ${escapeHtml(error.message)}
        </div>
      `;

      return;
    }


    if(!data || data.length === 0){

      list.innerHTML = `
        <p style="color:var(--muted)">
          Hələ heç bir məhsul əlavə edilməyib.
        </p>
      `;

      return;
    }


    list.innerHTML =
      data
        .map(product => {

          const image =
            product.image_url ||
            "https://via.placeholder.com/100?text=Parfum";


          return `

            <div class="product">

              <img
                src="${escapeAttr(image)}"
                alt="${escapeAttr(product.name)}"
              >


              <div>

                <h3>
                  ${escapeHtml(product.name)}
                </h3>


                <p>
                  ${Number(product.price).toFixed(2)} AZN
                  · ${product.ml} ML
                  · Stok: ${product.stock}
                </p>


                <p>
                  ${escapeHtml(
                    product.description || ""
                  )}
                </p>

              </div>


              <div class="actions">

                <button
                  onclick='editProduct(${JSON.stringify(product)})'
                >
                  Redaktə
                </button>


                <button
                  class="danger"
                  onclick="deleteProduct(${product.id})"
                >
                  Sil
                </button>

              </div>

            </div>

          `;

        })
        .join("");
  }


  // =====================================
  // CLEAR FORM
  // =====================================

  function clearForm(){

    document
      .getElementById("productId")
      .value = "";

    document
      .getElementById("name")
      .value = "";

    document
      .getElementById("price")
      .value = "";

    document
      .getElementById("ml")
      .value = "";

    document
      .getElementById("stock")
      .value = "";

    document
      .getElementById("description")
      .value = "";


    // Faylları təmizlə

    document
      .getElementById("image")
      .value = "";

    document
      .getElementById("image2")
      .value = "";

    document
      .getElementById("image3")
      .value = "";


    // Preview-ləri təmizlə

    [
      "imagePreview",
      "imagePreview2",
      "imagePreview3"
    ]
    .forEach(id => {

      const preview =
        document.getElementById(id);

      preview.src = "";
      preview.style.display = "none";

    });


    // Linkləri təmizlə

    [
      ["imageLink1","imageUrl1"],
      ["imageLink2","imageUrl2"],
      ["imageLink3","imageUrl3"]
    ]
    .forEach(item => {

      document
        .getElementById(item[0])
        .classList
        .add("hidden");

      document
        .getElementById(item[1])
        .textContent = "";

    });
  }


  // =====================================
  // NEW PRODUCT
  // =====================================

  function newProduct(){

    editingProduct = null;

    clearForm();


    document
      .getElementById("formTitle")
      .textContent =
      "Yeni məhsul əlavə et";


    document
      .getElementById("formMessage")
      .style
      .display = "none";


    const saveButton =
      document.getElementById(
        "saveButton"
      );

    saveButton.disabled = false;

    saveButton.textContent =
      "Yadda saxla";
  }


  // =====================================
  // EDIT PRODUCT
  // =====================================

  function editProduct(product){

    editingProduct = product;


    document
      .getElementById("productId")
      .value =
      product.id;


    document
      .getElementById("name")
      .value =
      product.name || "";


    document
      .getElementById("price")
      .value =
      product.price ?? "";


    document
      .getElementById("ml")
      .value =
      product.ml ?? "";


    document
      .getElementById("stock")
      .value =
      product.stock ?? "";


    document
      .getElementById("description")
      .value =
      product.description || "";


    // Fayl inputlarını təmiz saxla

    document
      .getElementById("image")
      .value = "";

    document
      .getElementById("image2")
      .value = "";

    document
      .getElementById("image3")
      .value = "";


    document
      .getElementById("formTitle")
      .textContent =
      "Məhsulu redaktə et";


    // Şəkilləri göstər

    setExistingImage(
      1,
      product.image_url
    );

    setExistingImage(
      2,
      product.image_url_2
    );

    setExistingImage(
      3,
      product.image_url_3
    );


    document
      .getElementById("formMessage")
      .style
      .display = "none";


    document
      .getElementById("saveButton")
      .disabled = false;


    window.scrollTo({

      top:0,

      behavior:"smooth"

    });
  }


  // =====================================
  // SHOW EXISTING IMAGE
  // =====================================

  function setExistingImage(
    index,
    url
  ){

    const previewId =
      index === 1
        ? "imagePreview"
        : index === 2
          ? "imagePreview2"
          : "imagePreview3";


    const linkBoxId =
      index === 1
        ? "imageLink1"
        : index === 2
          ? "imageLink2"
          : "imageLink3";


    const urlId =
      index === 1
        ? "imageUrl1"
        : index === 2
          ? "imageUrl2"
          : "imageUrl3";


    const preview =
      document.getElementById(
        previewId
      );

    const linkBox =
      document.getElementById(
        linkBoxId
      );

    const urlBox =
      document.getElementById(
        urlId
      );


    if(url){

      preview.src = url;

      preview.style.display =
        "block";

      urlBox.textContent =
        url;

      linkBox.classList
        .remove("hidden");

    }else{

      preview.src = "";

      preview.style.display =
        "none";

      urlBox.textContent = "";

      linkBox.classList
        .add("hidden");
    }
  }


  // =====================================
  // UPLOAD IMAGE
  // =====================================

  async function uploadImage(file){

    if(!file){
      return null;
    }


    const ext =
      (
        file.name
          .split(".")
          .pop() ||
        "jpg"
      )
      .toLowerCase()
      .replace(
        /[^a-z0-9]/g,
        ""
      );


    const path =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2) +
      "." +
      ext;


    const { error } =
      await supabaseClient
        .storage
        .from("product-images")
        .upload(
          path,
          file,
          {
            upsert:false,
            contentType:file.type
          }
        );


    if(error){
      throw error;
    }


    const { data } =
      supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(path);


    return data.publicUrl;
  }


  // =====================================
  // DELETE OLD STORAGE IMAGE
  // =====================================

  async function deleteStorageImage(
    imageUrl
  ){

    if(!imageUrl){
      return;
    }


    const marker =
      "/storage/v1/object/public/product-images/";


    const position =
      imageUrl.indexOf(marker);


    if(position === -1){
      return;
    }


    const filePath =
      decodeURIComponent(
        imageUrl.substring(
          position + marker.length
        )
      );


    const { error } =
      await supabaseClient
        .storage
        .from("product-images")
        .remove([
          filePath
        ]);


    if(error){

      console.warn(
        "Köhnə şəkil Storage-dan silinmədi:",
        error.message
      );
    }
  }


  // =====================================
  // SAVE PRODUCT
  // =====================================

  async function saveProduct(){

    if(isSaving){
      return;
    }


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const price =
      Number(
        document
          .getElementById("price")
          .value
      );


    const ml =
      Number(
        document
          .getElementById("ml")
          .value
      );


    const stock =
      Number(
        document
          .getElementById("stock")
          .value
      );


    const description =
      document
        .getElementById("description")
        .value
        .trim();


    const file1 =
      document
        .getElementById("image")
        .files[0];


    const file2 =
      document
        .getElementById("image2")
        .files[0];


    const file3 =
      document
        .getElementById("image3")
        .files[0];


    const message =
      document.getElementById(
        "formMessage"
      );


    const saveButton =
      document.getElementById(
        "saveButton"
      );


    message.style.display =
      "none";


    // VALIDATION

    if(
      !name ||
      !price ||
      !ml
    ){

      showFormMessage(
        "Ad, qiymət və ML məlumatlarını doldurun.",
        "error"
      );

      return;
    }


    isSaving = true;

    saveButton.disabled = true;

    saveButton.textContent =
      "Yadda saxlanılır...";


    try{

      // Köhnə şəkillər

      const oldImageUrl =
        editingProduct?.image_url ||
        null;

      const oldImageUrl2 =
        editingProduct?.image_url_2 ||
        null;

      const oldImageUrl3 =
        editingProduct?.image_url_3 ||
        null;


      // Hazırkı linklər

      let imageUrl =
        oldImageUrl;

      let imageUrl2 =
        oldImageUrl2;

      let imageUrl3 =
        oldImageUrl3;


      // Yeni şəkilləri yüklə

      if(file1){

        imageUrl =
          await uploadImage(file1);
      }


      if(file2){

        imageUrl2 =
          await uploadImage(file2);
      }


      if(file3){

        imageUrl3 =
          await uploadImage(file3);
      }


      // Məhsul məlumatları

      const productData = {

        name:name,

        price:price,

        ml:ml,

        stock:stock || 0,

        image_url:imageUrl,

        image_url_2:imageUrl2,

        image_url_3:imageUrl3,

        description:description

      };


      // ================================
      // MÖVCUD MƏHSULU YENİLƏ
      // ================================

      if(editingProduct){

        const { error } =
          await supabaseClient
            .from("products")
            .update(productData)
            .eq(
              "id",
              editingProduct.id
            );


        if(error){
          throw error;
        }


        // Yeni şəkil qoyulubsa,
        // köhnə şəkli Storage-dan sil

        if(file1 && oldImageUrl){

          await deleteStorageImage(
            oldImageUrl
          );
        }


        if(file2 && oldImageUrl2){

          await deleteStorageImage(
            oldImageUrl2
          );
        }


        if(file3 && oldImageUrl3){

          await deleteStorageImage(
            oldImageUrl3
          );
        }


        // Uğurlu mesaj

        showFormMessage(
          "Məhsul uğurla yeniləndi.",
          "success"
        );


        // Formu təmizlə

        editingProduct = null;

        clearForm();


        document
          .getElementById("formTitle")
          .textContent =
          "Yeni məhsul əlavə et";

      }


      // ================================
      // YENİ MƏHSUL ƏLAVƏ ET
      // ================================

      else{

        const { error } =
          await supabaseClient
            .from("products")
            .insert(
              productData
            );


        if(error){
          throw error;
        }


        showFormMessage(
          "Məhsul uğurla əlavə edildi.",
          "success"
        );


        editingProduct = null;

        clearForm();


        document
          .getElementById("formTitle")
          .textContent =
          "Yeni məhsul əlavə et";
      }


      // Məhsulları yenilə

      await loadProducts();


    }catch(error){

      showFormMessage(
        "Xəta: " +
        error.message,
        "error"
      );

    }finally{

      isSaving = false;

      saveButton.disabled =
        false;

      saveButton.textContent =
        "Yadda saxla";
    }
  }


  // =====================================
  // FORM MESSAGE
  // =====================================

  function showFormMessage(
    text,
    type
  ){

    const message =
      document.getElementById(
        "formMessage"
      );


    message.textContent =
      text;


    message.className =
      "message " +
      (
        type === "success"
          ? "success"
          : "error"
      );


    message.style.display =
      "block";
  }


  // =====================================
  // DELETE PRODUCT
  // =====================================

  async function deleteProduct(id){

    const answer =
      confirm(
        "Bu məhsulu silmək istədiyinizə əminsiniz?"
      );


    if(!answer){
      return;
    }


    const { data:product,error } =
      await supabaseClient
        .from("products")
        .select(
          "image_url,image_url_2,image_url_3"
        )
        .eq(
          "id",
          id
        )
        .single();


    if(error){

      alert(
        "Məhsul məlumatı alınmadı: " +
        error.message
      );

      return;
    }


    const { error:deleteError } =
      await supabaseClient
        .from("products")
        .delete()
        .eq(
          "id",
          id
        );


    if(deleteError){

      alert(
        "Məhsul silinmədi: " +
        deleteError.message
      );

      return;
    }


    // Məhsulla birlikdə şəkilləri də sil

    await deleteStorageImage(
      product.image_url
    );

    await deleteStorageImage(
      product.image_url_2
    );

    await deleteStorageImage(
      product.image_url_3
    );


    await loadProducts();
  }


  // =====================================
  // SECURITY HELPERS
  // =====================================

  function escapeHtml(value){

    return String(
      value ?? ""
    )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
  }


  function escapeAttr(value){

    return escapeHtml(value);
  }


  // =====================================
  // START
  // =====================================

  checkSession();

</script>
